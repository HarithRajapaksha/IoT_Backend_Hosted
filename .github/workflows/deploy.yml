name: Deploy Backend to Ubuntu Server

on:
  pull_request:
    types: [assigned]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "Backend/*,.docker/*"
          target: "~/iot_backend_hosted"

      - name: Run docker-compose on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/iot_backend_hosted/.docker
            docker-compose pull
            docker-compose up -d --build
